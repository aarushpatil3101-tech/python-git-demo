name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pylint
        run: pip install pylint

      - name: Run Python program
        run: python x.py

      - name: Run PyUnit tests
        run: python -m unittest test_x.py

      - name: Run Pylint
        run: pylint x.py